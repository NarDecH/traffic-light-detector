name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package list starts with "tools", a package that
      # no longer exists in the SDK repository, so sdkmanager exits with
      # "Failed to find package 'tools'". Ask for the components this build
      # really needs instead: the compileSdk 36 platform and the build-tools
      # version AGP 8.9 defaults to.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # The Gradle wrapper jar is intentionally not committed, so CI provides
      # Gradle itself instead of running ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # Hard gate: `abortOnError` is on (see app/build.gradle.kts), so a lint
      # error fails the build instead of being hidden behind continue-on-error.
      # Warnings stay advisory but are printed and uploaded below.
      - name: Android Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Print lint summary
        if: always()
        run: |
          report=app/build/reports/lint-results-debug.txt
          if [ -f "$report" ]; then tail -40 "$report"; else echo "No text lint report produced"; fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  model-tools:
    name: Model tooling (python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Standard library only, so there is nothing to install and the job stays
      # fast. The TensorFlow-dependent integration tests skip themselves here;
      # run them locally after `pip install "tensorflow>=2.15"`.
      - name: Unit tests for tools/
        run: python -m unittest discover -s tools/tests -v
