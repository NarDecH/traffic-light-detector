name: Release

# Publishes a GitHub Release whenever a `v*` tag is pushed: runs both test
# suites, builds (and, when the signing secrets are configured, signs) the
# release APK, then creates the release with the APK, its SHA-256 checksum and
# the matching CHANGELOG.md section as the body.
#
# Re-running for an existing tag is possible from the Actions tab -- that is
# how an unsigned APK gets replaced after the signing secrets are added (see
# CONTRIBUTING.md); assets the re-run no longer produces are pruned from the
# release so a superseded file never sits next to the current one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.2.0"
        required: true

permissions:
  contents: write # required to create the release; nothing else is written

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same components as android.yml: the action's default package list
      # starts with "tools", which no longer exists in the SDK repository.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # The Gradle wrapper jar is intentionally not committed, so CI provides
      # Gradle itself (same version as gradle/wrapper/gradle-wrapper.properties).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # An APK whose versionName disagrees with the tag would be mislabelled,
      # so that mismatch fails the run before anything is built.
      - name: Check the tag matches versionName
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! grep -Fq "versionName = \"$version\"" app/build.gradle.kts; then
            echo "::error::tag $TAG does not match versionName in app/build.gradle.kts"
            exit 1
          fi

      - name: Unit tests (JVM)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Unit tests (tools/)
        run: python -m unittest discover -s tools/tests -v

      # Writes the gitignored keystore.properties so :app:assembleRelease signs
      # the APK; without the secrets the APK stays unsigned and the release
      # notes say so. See CONTRIBUTING.md for how to add the secrets.
      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret: the APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # The release notes claim the attached file is signed and installable, so
      # check the artifact instead of trusting the build: with the signing
      # secrets configured the APK must verify and its certificate must be the
      # one inside the keystore decoded above. Running before the release is
      # touched means a bad file never reaches the release page.
      - name: Verify the APK signature
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          signed=app/build/outputs/apk/release/app-release.apk

          # No secrets: unsigned releases are still allowed, but they must not
          # be mistaken for signed ones (CONTRIBUTING.md documents the trade-off).
          if [ ! -f keystore.properties ]; then
            echo "::warning::signing secrets are not configured: this release is unsigned (see CONTRIBUTING.md)"
            exit 0
          fi

          if [ ! -f "$signed" ]; then
            echo "::error::keystore.properties exists but $signed was not produced, so the release would be unsigned"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi

          keystore=$(sed -n 's/^storeFile=//p' keystore.properties)
          if [ ! -f "$keystore" ]; then
            echo "::error::keystore.properties points at a missing keystore: $keystore"
            exit 1
          fi

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          build_tools=$(ls -d "$sdk_root"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          apksigner="$build_tools/apksigner"
          if [ -z "$build_tools" ] || [ ! -x "$apksigner" ]; then
            echo "::error::apksigner was not found under $sdk_root/build-tools"
            exit 1
          fi

          if ! apksigner_output=$("$apksigner" verify --print-certs "$signed" 2>&1); then
            echo "::error::apksigner verify failed: the APK is not correctly signed"
            printf '%s\n' "$apksigner_output"
            exit 1
          fi
          printf '%s\n' "$apksigner_output"

          # The certificate line is prefixed differently depending on the
          # build-tools version ("Signer #1 certificate …" in 36.x,
          # "V2 Signer: certificate …" in 35.x), so match on the label only.
          # "public key SHA-256 digest" lines must not match.
          apk_digest=$(printf '%s\n' "$apksigner_output" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -1 | tr -d ':\r' | tr 'A-Z' 'a-z')
          # keytool prints the fingerprint indented with a tab, hence [[:space:]]
          keystore_digest=$(keytool -list -v -keystore "$keystore" -storepass:env STORE_PASSWORD 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':\r' | tr 'A-Z' 'a-z')

          if [ -z "$apk_digest" ] || [ "$apk_digest" != "$keystore_digest" ]; then
            echo "::error::the APK is not signed with the expected key (apk=$apk_digest keystore=$keystore_digest)"
            exit 1
          fi
          echo "Signed with the expected release key: $apk_digest"

      # One human-readable file name (traffic-light-detector-1.2.0.apk) plus a
      # checksum, and release notes that open with the warnings that matter.
      - name: Collect APK, checksum and release notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          apk=app/build/outputs/apk/release/app-release.apk
          unsigned=""
          if [ ! -f "$apk" ]; then
            apk=app/build/outputs/apk/release/app-release-unsigned.apk
            unsigned="-unsigned"
          fi
          mkdir -p dist
          asset="dist/traffic-light-detector-${version}${unsigned}.apk"
          name="$(basename "$asset")"
          cp "$apk" "$asset"
          ( cd dist && sha256sum "$name" > "$name.sha256" )

          python tools/changelog_section.py "$version" > changelog-section.md

          {
            if [ -n "$unsigned" ]; then
              echo "> ⚠️ APK นี้ยังไม่ถูกเซ็น (ยังไม่ได้ตั้ง signing secrets) — ติดตั้งตรง ๆ ไม่ได้"
              echo "> ตั้งค่า secrets ตาม CONTRIBUTING.md แล้วรัน workflow นี้อีกครั้งเพื่อแนบไฟล์ที่เซ็นแล้ว"
              echo
            fi
            if ! ls app/src/main/assets/*.tflite > /dev/null 2>&1; then
              echo "> ⚠️ แท็กนี้ไม่มีไฟล์โมเดล (app/src/main/assets/*.tflite) — แอปจะขึ้น Model error"
              echo "> เทรน/วางโมเดลตาม docs/TRAINING.md แล้วออกเวอร์ชันใหม่"
              echo
            fi
            cat changelog-section.md
            echo
            echo "### Assets"
            echo
            echo "- \`$name\` — APK"
            echo "- \`$name.sha256\` — SHA-256 checksum"
          } > release-notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Prune first: an unsigned APK left over from before the signing
            # secrets existed (or from any earlier naming) would otherwise stay
            # attached next to the signed file, which is exactly the file users
            # must not download. Anything still produced by this run is kept.
            while IFS= read -r stale; do
              if [ -n "$stale" ] && [ ! -f "dist/$stale" ]; then
                echo "Removing stale asset: $stale"
                gh release delete-asset "$TAG" "$stale" --yes
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
