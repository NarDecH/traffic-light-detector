<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 890" width="460" height="890" role="img" aria-label="App screen mock-up showing a green traffic light detected with a bounding box, a label chip and the control panel">
  <title>App screen — bounding boxes, status panel and controls</title>
  <style>
    .page { fill: #0d1117; }
    .phone { fill: #04070a; stroke: #30363d; stroke-width: 2; }
    .bar { fill: #000000; opacity: 0.55; }
    .scene { fill: #10151a; }
    .road { fill: #1b2026; }
    .pole { fill: #262d34; }
    .housing { fill: #1f262d; stroke: #39424a; stroke-width: 1.5; }
    .panel { fill: #000000; opacity: 0.62; stroke: #2b3138; stroke-width: 1; }
    .mono { font-family: 'Consolas', 'SFMono-Regular', monospace; }
    .ui { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .status { font-size: 15px; font-weight: 700; fill: #69f0ae; }
    .status-sub { font-size: 12px; fill: #dddddd; }
    .status-perf { font-size: 11px; fill: #a9b4bf; }
    .chip-text { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .ctl { font-size: 13px; fill: #ffffff; }
    .ctl-sub { font-size: 12px; fill: #e6edf3; }
    .clock { font-size: 12px; font-weight: 700; fill: #8b949e; }
    .caps { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
  </style>

  <rect class="page" x="0" y="0" width="460" height="890" />

  <!-- phone frame -->
  <rect class="phone" x="30" y="30" width="400" height="840" rx="30" />
  <rect x="180" y="38" width="100" height="8" rx="4" fill="#30363d" />

  <!-- screen = preview area (match_parent) with the 3:4 frame letterboxed -->
  <rect class="scene" x="32" y="52" width="396" height="796" rx="24" />
  <rect class="bar" x="32" y="52" width="396" height="134" />
  <rect class="bar" x="32" y="714" width="396" height="134" />
  <text class="mono clock" x="60" y="80">9:41</text>
  <rect x="384" y="70" width="26" height="12" rx="3" fill="none" stroke="#8b949e" stroke-width="1.2" />
  <rect x="386" y="72" width="16" height="8" rx="1.5" fill="#8b949e" />

  <!-- the upright 3:4 camera frame (content rect = 396 x 528, y 186..714) -->
  <rect class="scene" x="32" y="186" width="396" height="528" />
  <path class="road" d="M32,714 L428,714 L336,470 L124,470 z" />
  <rect x="226" y="640" width="8" height="42" fill="#e6edf3" opacity="0.75" />
  <rect x="228" y="576" width="4" height="30" fill="#e6edf3" opacity="0.55" />
  <rect x="230" y="520" width="3" height="22" fill="#e6edf3" opacity="0.4" />

  <!-- far signal (red) -->
  <rect class="pole" x="84" y="330" width="8" height="150" />
  <rect class="housing" x="58" y="228" width="60" height="150" rx="10" />
  <circle cx="88" cy="262" r="15" fill="#ff5252" />
  <circle cx="88" cy="304" r="15" fill="#3a3520" />
  <circle cx="88" cy="346" r="15" fill="#1f3a26" />
  <rect x="62" y="234" width="46" height="46" rx="4" fill="#e53935" fill-opacity="0.16" stroke="#e53935" stroke-width="2.5" />
  <path d="M62,252 L62,234 L80,234" stroke="#ff8a80" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M108,252 L108,234 L90,234" stroke="#ff8a80" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M62,262 L62,280 L80,280" stroke="#ff8a80" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M108,262 L108,280 L90,280" stroke="#ff8a80" stroke-width="4" fill="none" stroke-linecap="round" />
  <rect x="38" y="204" width="94" height="24" rx="5" fill="#b71c1c" />
  <text class="ui chip-text" x="47" y="221">RED 88%</text>

  <!-- near signal (green, the one that triggers the alarm) -->
  <rect class="pole" x="354" y="400" width="10" height="180" />
  <rect class="housing" x="326" y="196" width="66" height="170" rx="10" />
  <circle cx="359" cy="228" r="17" fill="#3a1f1f" />
  <circle cx="359" cy="278" r="17" fill="#3a3520" />
  <circle cx="359" cy="330" r="27" fill="#2ee66b" opacity="0.18" />
  <circle cx="359" cy="330" r="18" fill="#2ee66b" />
  <rect x="333" y="304" width="50" height="50" rx="4" fill="#2e7d32" fill-opacity="0.20" stroke="#43a047" stroke-width="3" />
  <path d="M333,322 L333,304 L351,304" stroke="#56d364" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <path d="M383,322 L383,304 L365,304" stroke="#56d364" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <path d="M333,336 L333,354 L351,354" stroke="#56d364" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <path d="M383,336 L383,354 L365,354" stroke="#56d364" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <rect x="322" y="272" width="104" height="24" rx="5" fill="#2e7d32" />
  <text class="ui chip-text" x="331" y="289">GREEN 92%</text>

  <!-- status panel -->
  <rect class="panel" x="46" y="64" width="368" height="106" rx="12" />
  <text class="ui status" x="60" y="94">GREEN LIGHT — GO</text>
  <text class="mono status-sub" x="60" y="118">green_light 92%</text>
  <text class="mono status-sub" x="60" y="136">red_light 88%</text>
  <text class="mono status-perf" x="60" y="156">41 ms · 9.8 fps · GPU · green 92% · alarms 1</text>

  <!-- control panel -->
  <rect class="panel" x="46" y="724" width="368" height="112" rx="12" />
  <text class="ui ctl" x="60" y="758">Alarm on green light</text>
  <rect x="356" y="742" width="42" height="22" rx="11" fill="#69f0ae" />
  <circle cx="388" cy="753" r="9" fill="#0d1117" />
  <text class="ui ctl-sub" x="60" y="792">Confidence threshold: 70%</text>
  <rect x="60" y="806" width="340" height="4" rx="2" fill="#3a4148" />
  <rect x="60" y="806" width="110" height="4" rx="2" fill="#7aa2f7" />
  <circle cx="170" cy="808" r="8" fill="#7aa2f7" />

  <text class="caps" x="30" y="886">Mock-up of the app screen: rounded box + corner brackets + label chip per detection, status panel and controls</text>
</svg>
